<div class="date-picker-wrapper">
  <button
    class="arrow-btn prev-btn"
    (click)="previousDay()"
    [disabled]="isPreviousDayDisabled()"
    [class.disabled]="isPreviousDayDisabled()"
    title="Vorige dag">
    <i class="fas fa-chevron-left"></i>
  </button>
  <p-date-picker
    [formControl]="selectedDate"
    [minDate]="minDate()"
    [maxDate]="maxDate"
    placeholder="Selecteer een datum">
  </p-date-picker>
  <button
    class="arrow-btn next-btn"
    (click)="nextDay()"
    [disabled]="isNextDayDisabled()"
    [class.disabled]="isNextDayDisabled()"
    title="Volgende dag">
    <i class="fas fa-chevron-right"></i>
  </button>
</div>
