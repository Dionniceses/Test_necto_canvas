<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PixiJS Batch Test</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
</head>
<body>
  <div id="app">
    <div id="canvas-wrapper">
      <!-- PixiJS zal zelf een canvas aanmaken -->
      <span id="renderer-tag">PixiJS</span>
      <div id="controls">
        <button id="btn-pause">&#10074;&#10074; Pauze</button>
        <div id="timeline-panel">
          <div id="timeline-top">
            <span id="live-indicator" class="live">LIVE</span>
            <button id="btn-live" type="button">Naar Live</button>
          </div>
          <div id="timeline-track" role="slider" aria-label="Timeline">
            <div id="timeline-buffer"></div>
            <div id="timeline-cursor"></div>
          </div>
          <div id="timeline-meta">
            <span id="timeline-current">--:--:--</span>
            <span id="timeline-loading" class="hidden">Laden...</span>
          </div>
        </div>
        <span id="zoom-level">Zoom: 100%</span>
      </div>
    </div>
    <div id="sidebar" class="empty">
      <div id="sidebar-header" style="display:none">
        <h3 id="sidebar-title"></h3>
        <button id="sidebar-close">&times;</button>
      </div>
      <div id="sidebar-body">
        <div id="sidebar-placeholder">Klik op een box of lijn<br>om details te zien</div>
      </div>
    </div>
  </div>
  <script type="module" src="./dist/pixi.js"></script>
</body>
</html>
